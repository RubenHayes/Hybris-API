      \                                    additionalProperties: !strictSchemaValidation,\r

      \                                    required: [\"stockLevel\", \"stockLevelStatus\"],\r

      \                                    properties: {\r

      \                                        stockLevel:         { type: \"number\" },\r

      \                                        stockLevelStatus:   { type: \"string\" }\r

      \                                    }\r

      \                                },\r

      \                                url: { type: \"string\" }\r

      \                            }\r

      \                        },\r

      \                        quantity: { type: \"number\" },\r

      \                        totalPrice: {\r

