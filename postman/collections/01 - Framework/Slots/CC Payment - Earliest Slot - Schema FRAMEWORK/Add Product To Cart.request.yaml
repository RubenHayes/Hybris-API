      \r

      // 🧩 ~~ Generic Uptime Tests ~~ 🧩\r

      pm.test(\"[Carts Controller] Add Product To Cart - Status code is 200\", () => {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"[Carts Controller] Add Product To Cart - Response status is OK\", () => {\r

      \    pm.expect(pm.response.status).to.eq(\"OK\");\r

      });\r

      \r

      // Conditional check for further testing\r

      if (pm.response.code === 200) {\r

      \r

      \    // 🧩 ~~ Variable Declarations ~~ 🧩\r

      \    var jsonData         = pm.response.json();\r

      \    var entry0           = jsonData.entry;\r

      \    var entry0Quantity   = entry0.quantity;\r

      \    var entry0Price      = entry0.product.price.value;\r

      \    var entry0TotalPrice = entry0.totalPrice && entry0.totalPrice.value;\r

      \    var stock            = entry0.product.stock || {};\r

      \    var stockLevel       = stock.stockLevel;\r

      \    var stockLevelStatus = stock.stockLevelStatus;\r

      \r

      \    // Persist useful values for downstream requests\r

      \    pm.collectionVariables.set(\"entryGuid\", entry0.guid);\r

      \    pm.collectionVariables.set(\"productPrice\", entry0.product.price.value);\r

      \r

      \    if (runBaselineTests) {\r

      \r

      \        // 🧩 ~~ Schema Definition ~~ 🧩\r

      \        // Strict mode toggle (refer to 🧩 ~~ Strict Schema Toggle ~~ 🧩):\r

      \        // strictSchemaValidation = true -> no extra fields allowed\r

      \        // strictSchemaValidation = false -> extra fields allowed\r

      \        const responseSchema = {\r

      \            type: \"object\",\r

      \            additionalProperties: !strictSchemaValidation,\r

      \            required: [\"entry\",\r

      \             \"quantity\",\r

      \             \"quantityAdded\",\r

      \             \"statusCode\"\r

      \            ],\r

      \            properties: {\r

      \                entry: {\r

      \                    type: \"object\",\r

      \                    additionalProperties: !strictSchemaValidation,\r

      \                    required: [\r

      \                        \"allowSubstitute\",\r

      \                        \"categoryDisplayGroup\",\r

      \                        \"configurationInfos\",\r

      \                        \"entryNumber\",\r

      \                        \"giveAway\",\r

      \                        \"guid\",\r

      \                        \"product\",\r

      \                        \"quantity\",\r

      \                        \"totalPrice\"\r

      \                    ],\r

      \                    properties: {\r

      \                        allowSubstitute: { type: \"boolean\" },\r

      \                        categoryDisplayGroup: {\r

      \                            type: \"object\",\r

      \                            additionalProperties: !strictSchemaValidation,\r

      \                            required: [\"code\", \"name\"],\r

      \                            properties: {\r

      \                                code:   { type: \"string\" },\r

      \                                name:   { type: \"string\" }\r

      \                            }\r

      \                        },\r

      \                        configurationInfos: {\r

      \                            type: \"array\",\r

      \                            items: {\r

      \                                type: \"object\",\r

      \                                // keep flexible, unknown details\r

      \                                additionalProperties: true\r

      \                            }\r

      \                        },\r

      \                        entryNumber:    { type: \"number\" },\r

      \                        giveAway:       { type: \"boolean\" },\r

      \                        guid:           { type: \"string\" },\r

      \                        product: {\r

      \                            type: \"object\",\r

      \                            additionalProperties: !strictSchemaValidation,\r

      \                            required: [\r

      \                                \"available\",\r

      \                                \"availableForPickup\",\r

      \                                \"baseProduct\",\r

      \                                \"brand\",\r

      \                                \"brandSellerId\",\r

      \                                \"code\",\r

      \                                \"inStockIndicator\",\r

      \                                \"name\",\r

      \                                \"price\",\r

      \                                \"productIdForTracking\",\r

      \                                \"purchasable\",\r

      \                                \"stock\",\r

      \                                \"url\"\r

      \                            ],\r

      \                            properties: {\r

      \                                available:             { type: \"boolean\" },\r

      \                                availableForPickup:    { type: \"boolean\" },\r

      \                                baseProduct:           { type: \"string\" },\r

      \                                brand:                 { type: \"string\" },\r

      \                                brandSellerId:         { type: \"string\" },\r

      \                                code:                  { type: \"string\" },\r

      \                                inStockIndicator:      { type: \"boolean\" },\r

      \                                name:                  { type: \"string\" },\r

      \                                price: {\r

      \                                    type: \"object\",\r

      \                                    additionalProperties: !strictSchemaValidation,\r

      \                                    required: [\"currencyIso\", \"oldPrice\", \"value\"],\r

      \                                    properties: {\r

      \                                        currencyIso:   { type: \"string\" },\r

      \                                        oldPrice:      { type: \"number\" },\r

      \                                        value:         { type: \"number\" }\r

      \                                    }\r

      \                                },\r

      \                                productIdForTracking:  { type: \"string\" },\r

      \                                purchasable:           { type: \"boolean\" },\r

