      \                    type: \"string\"\r

      \                }\r

      \            }\r

      \        };\r

      \r

      \        // 🧩 ~~ Schema Validation Test ~~ 🧩\r

      \        pm.test(\"[Carts Controller] Add Product To Cart - Response matches schema\", () => {\r

      \            pm.response.to.have.jsonSchema(responseSchema);\r

      \        });\r

      \    }\r

      \r

      \    // 🧩 ~~ Functional Tests ~~ 🧩\r

      \    if (runFunctionalTests) {\r

      \r

      \        // --- Complementary Functional Tests (schema-like expectations) ---\r

      \        pm.test(\"[Carts Controller] Add Product To Cart - statusCode is 'success'\", () => {\r

      \            pm.expect(jsonData.statusCode).to.eq(\"success\");\r

      \        });\r

      \r

      \        pm.test(\"[Carts Controller] Add Product To Cart - Product quantity on entry is 5\", () => {\r

      \            pm.expect(entry0Quantity).to.eq(5);\r

      \        });\r

      \r

      \        pm.test(\"[Carts Controller] Add Product To Cart - Requested quantity is 5\", () => {\r

      \            pm.expect(jsonData.quantity).to.eq(5);\r

      \        });\r

      \r

      \        pm.test(\"[Carts Controller] Add Product To Cart - quantityAdded is 5\", () => {\r

      \            pm.expect(jsonData.quantityAdded).to.eq(5);\r

      \        });\r

      \r

      \        pm.test(\"[Carts Controller] Add Product To Cart - entryGuid is not empty\", () => {\r

      \            pm.expect(entry0.guid.length).to.be.greaterThan(0);\r

      \        });\r

      \r

      \        // --- Business Rule Functional Tests ---\r

      \        pm.test(\"[Carts Controller] Add Product To Cart - stockLevel is not 0\", () => {\r

      \            pm.expect(stockLevel).not.to.eql(0);\r

      \        });\r

      \r

      \        pm.test(\"[Carts Controller] Add Product To Cart - stockLevelStatus is 'inStock'\", () => {\r

      \            pm.expect(stockLevelStatus).to.eq(\"inStock\");\r

      \        });\r

      \r

      \        pm.test(\"[Carts Controller] Add Product To Cart - First entry total price is correct\", () => {\r

      \            var expectedTotal = entry0Quantity * entry0Price;\r

      \            expectedTotal = Number(expectedTotal.toFixed(2)); // round to 2 decimals\r

      \            pm.expect(Number(entry0TotalPrice)).to.eql(expectedTotal);\r

      \        });\r

      \    }\r

      \r

      \    // === Console Message ===\r

      \    console.log(`===== ${pm.info.requestName} - PASS =====`);\r

      \r

      } else {\r

      \    // === Console Message ===\r

      \    console.log(`===== ${pm.info.requestName} - FAIL =====`);\r

