$kind: http-request
url: "{{pnpOne}}/users/current/carts/{{cart}}?refreshCart=true&fields=FULL"
method: GET
headers:
  - key: referer
    value: https://hyb.dev.pnpapi.co.za/checkout/payment-details
    disabled: true
  - key: accept
    value: application/json, text/plain, */*
    disabled: true
queryParams:
  - key: fields
    value: carts(BASIC,purchaseOrderNumber,appliedOrderPromotions,appliedProductPromotions,fulfilmentOption,appliedVouchers)
    disabled: true
  - key: refreshCart
    value: "true"
  - key: fields
    value: FULL
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: "// ===========================================\r

      // Request: GET /users/current/carts/{{cart}}?refreshCart=true&fields=FULL\r

      // Purpose: Retrieves the full cart details and validates the total price for the current cart\r

      // Auth: Bearer Token | {{accessToken}}\r

      // Expected status: 200 OK\r

      // ===========================================\r

      \r

      // 🧩 ~~ Test Configuration ~~ 🧩\r

      var runBaselineTests   = pm.collectionVariables.get(\"runBaselineTests\");    // Set to false to skip baseline tests\r

      var runFunctionalTests = pm.collectionVariables.get(\"runFunctionalTests\");  // Set to false to skip functional tests \r

      var environmentFlag    = pm.environment.name;                               // Get the current environment name\r

      \r

      // 🧩 ~~ Strict Schema Toggle ~~ 🧩\r

      // Uncomment the line below to force strict validation ON for this request only\r

      // var strictSchemaValidation = true;\r

      \r

      // Use collection variable (default behavior) - comment this out if you want to override the collection variable value\r

      var strictSchemaValidationRaw = pm.collectionVariables.get(\"strictSchemaValidation\");\r

      var strictSchemaValidation    =\r

      \    strictSchemaValidationRaw === true || strictSchemaValidationRaw === \"true\";\r

      \r

      // 🧩 ~~ Generic Uptime Tests ~~ 🧩\r

      pm.test(\"[Carts Controller] Get Total Cart Price - Status code is 200\", () => {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"[Carts Controller] Get Total Cart Price - Response status is OK\", () => {\r

      \    pm.expect(pm.response.status).to.eq(\"OK\");\r

      });\r

      \r

      // Conditional check for further testing\r

      if (pm.response.code === 200) {\r

      \r

      \    // 🧩 ~~ Variable Declarations ~~ 🧩\r

      \    var jsonData                 = pm.response.json();\r

      \    var baseStore                = jsonData.baseStore || {};\r

      \    var minimumSpendMet          = jsonData.minimumSpendMet;\r

      \    var deliveryAddress          = pm.collectionVariables.get(\"selectedDeliveryAddressId\") \r

      \    console.log(deliveryAddress)\r

      \r

      \    if (runBaselineTests) {\r

      \r

      \        // 🧩 ~~ Schema Definition ~~ 🧩\r

      \        // Partial schema focusing on key structures to keep it maintainable for FULL response\r

      \        const responseSchema = {\r

      \            type: \"object\",\r

      \            additionalProperties: !strictSchemaValidation,\r

      \            required: [\r

      \                \"type\",\r

      \                \"code\",\r

      \                \"entries\",\r

      \                \"summary\",\r

      \                \"totalItems\",\r

      \                \"totalPrice\",\r

      \                \"totalPriceWithTax\",\r

      \                \"totalPriceWithTaxAndDriverTip\",\r

      \                \"totalPriceWithTolerances\",\r

      \                \"subTotal\",\r

      \                \"deliveryCost\",\r

      \                \"minimumSpend\",\r

      \                \"minimumSpendMet\",\r

      \                \"valueTowardMinimumSpend\",\r

      \                \"totalTolerance\"\r

      \            ],\r

      \            properties: {\r

      \                type: { type: \"string\" },\r

      \                code: { type: \"string\" },\r

      \                entries: {\r

      \                    type: \"array\",\r

      \                    items: {\r

      \                        type: \"object\",\r

      \                        additionalProperties: !strictSchemaValidation,\r

      \                        required: [\"entryNumber\", \"quantity\", \"totalPrice\", \"product\"],\r

      \                        properties: {\r

      \                            entryNumber: { type: \"number\" },\r

      \                            quantity:    { type: \"number\" },\r

      \                            totalPrice: {\r

      \                                type: \"object\",\r

      \                                additionalProperties: !strictSchemaValidation,\r

      \                                required: [\"currencyIso\", \"value\"],\r

      \                                properties: {\r

      \                                    currencyIso: { type: \"string\" },\r

      \                                    value:       { type: \"number\" }\r

      \                                }\r

      \                            },\r

      \                            product: {\r

      \                                type: \"object\",\r

      \                                additionalProperties: !strictSchemaValidation,\r

      \                                required: [\"code\", \"name\"],\r

      \                                properties: {\r

      \                                    code: { type: \"string\" },\r

      \                                    name: { type: \"string\" }\r

      \                                }\r

      \                            }\r

      \                        }\r

      \                    }\r

      \                },\r

      \                totalPrice: {\r

      \                    type: \"object\",\r

      \                    additionalProperties: !strictSchemaValidation,\r

      \                    required: [\"currencyIso\", \"value\"],\r

      \                    properties: {\r

      \                        currencyIso: { type: \"string\" },\r

      \                        value:       { type: \"number\" }\r

      \                    }\r

      \                },\r

      \                totalPriceWithTax: {\r

      \                    type: \"object\",\r

      \                    additionalProperties: !strictSchemaValidation,\r

      \                    required: [\"currencyIso\", \"value\"],\r

      \                    properties: {\r

      \                        currencyIso: { type: \"string\" },\r

      \                        value:       { type: \"number\" }\r

      \                    }\r

      \                },\r

      \                totalPriceWithTaxAndDriverTip: {\r

      \                    type: \"object\",\r

      \                    additionalProperties: !strictSchemaValidation,\r

      \                    required: [\"currencyIso\", \"value\"],\r

      \                    properties: {\r

      \                        currencyIso: { type: \"string\" },\r

      \                        value:       { type: \"number\" }\r

      \                    }\r

      \                },\r

      \                totalPriceWithTolerances: {\r

      \                    type: \"object\",\r

      \                    additionalProperties: !strictSchemaValidation,\r

      \                    required: [\"currencyIso\", \"formattedValue\", \"value\"],\r

      \                    properties: {\r

      \                        currencyIso:    { type: \"string\" },\r

      \                        formattedValue: { type: \"string\" },\r

      \                        value:          { type: \"number\" }\r

      \                    }\r

      \                },\r

      \                subTotal: {\r

      \                    type: \"object\",\r

      \                    additionalProperties: !strictSchemaValidation,\r

      \                    required: [\"currencyIso\", \"value\"],\r

      \                    properties: {\r

      \                        currencyIso: { type: \"string\" },\r

      \                        value:       { type: \"number\" }\r

      \                    }\r

      \                },\r

      \                deliveryCost: {\r

      \                    type: \"object\",\r

      \                    additionalProperties: !strictSchemaValidation,\r

      \                    required: [\"currencyIso\", \"value\"],\r

      \                    properties: {\r

      \                        currencyIso: { type: \"string\" },\r

      \                        value:       { type: \"number\" }\r

      \                    }\r

      \                },\r

      \                summary: {\r

      \                    type: \"object\",\r

      \                    additionalProperties: !strictSchemaValidation,\r

      \                    required: [\"summaryBreakdown\", \"totals\"],\r

      \                    properties: {\r

      \                        summaryBreakdown: {\r

      \                            type: \"array\",\r

      \                            items: {\r

      \                                type: \"object\",\r

      \                                additionalProperties: !strictSchemaValidation,\r

      \                                required: [\"name\", \"value\", \"formattedValue\"],\r

      \                                properties: {\r

      \                                    name:           { type: \"string\" },\r

      \                                    value:          { type: \"number\" },\r

      \                                    formattedValue: { type: \"string\" }\r

      \                                }\r

      \                            }\r

      \                        },\r

      \                        totals: {\r

      \                            type: \"object\",\r

      \                            additionalProperties: !strictSchemaValidation,\r

      \                            required: [\"cartTotal\", \"total\"],\r

      \                            properties: {\r

      \                                cartTotal: {\r

      \                                    type: \"object\",\r

      \                                    additionalProperties: !strictSchemaValidation,\r

      \                                    required: [\"value\"],\r

      \                                    properties: {\r

      \                                        value: { type: \"number\" }\r

      \                                    }\r

      \                                },\r

      \                                total: {\r

      \                                    type: \"object\",\r

      \                                    additionalProperties: !strictSchemaValidation,\r

      \                                    required: [\"value\"],\r

      \                                    properties: {\r

      \                                        value: { type: \"number\" }\r

      \                                    }\r

      \                                }\r

      \                            }\r

      \                        }\r

      \                    }\r

      \                },\r

      \                minimumSpend: {\r

      \                    type: \"object\",\r

      \                    additionalProperties: !strictSchemaValidation,\r

      \                    required: [\"currencyIso\", \"value\"],\r

      \                    properties: {\r

      \                        currencyIso: { type: \"string\" },\r

      \                        value:       { type: \"number\" }\r

      \                    }\r

      \                },\r

      \                valueTowardMinimumSpend: {\r

      \                    type: \"object\",\r

      \                    additionalProperties: !strictSchemaValidation,\r

      \                    required: [\"currencyIso\", \"value\"],\r

      \                    properties: {\r

      \                        currencyIso: { type: \"string\" },\r

      \                        value:       { type: \"number\" }\r

      \                    }\r

      \                },\r

      \                minimumSpendMet: { type: \"boolean\" },\r

      \                totalTolerance: {\r

      \                    type: \"object\",\r

      \                    additionalProperties: !strictSchemaValidation,\r

      \                    required: [\"currencyIso\", \"formattedValue\", \"value\"],\r

      \                    properties: {\r

      \                        currencyIso:    { type: \"string\" },\r

      \                        formattedValue: { type: \"string\" },\r

      \                        value:          { type: \"number\" }\r

      \                    }\r

      \                },\r

      \                totalItems: { type: \"number\" }\r

      \            }\r

      \        };\r

      \r

      \        // 🧩 ~~ Schema Validation Test ~~ 🧩\r

      \        pm.test(\"[Carts Controller] Get Total Cart Price - Response matches schema\", () => {\r

      \            pm.response.to.have.jsonSchema(responseSchema);\r

      \        });\r

      \    }\r

      \r

      \    // 🧩 ~~ Functional Tests ~~ 🧩\r

      \    if (runFunctionalTests) {\r

      \r

      \        // --- Business Rule Functional Tests ---\r

      \        pm.test(\"[Carts Controller] Get Total Cart Price - Minimum spend met is false\", () => {\r

      \            pm.expect(minimumSpendMet).to.be.false;\r

      \        });\r

      \r

      \        pm.test(\"[Carts Controller] Get Total Cart Price - Type field is correct\", () => {\r

      \            pm.expect(jsonData.type).to.eq(\"cartWsDTO\");\r

      \        });\r

      \r

      \        pm.test(\"[Carts Controller] Get Total Cart Price - Base store info is correct\", () => {\r

      \            pm.expect(baseStore.displayName).to.eq(\"Test Claremont \");\r

      \            pm.expect(baseStore.name).to.eq(\"WC18 Claremont\");\r

      \            pm.expect(baseStore.uid).to.eq(\"WC18\");    \r

      \        });\r

      \        \r

      \        pm.test(\"[Carts Controller] Get Total Cart Price - Delivery address is correct\", () => {\r

      \            pm.expect(jsonData.deliveryAddress.id).to.eq(deliveryAddress);  \r

      \        });\r

      \    }\r

      \r

      \    // === Console Message ===\r

      \    console.log(`===== ${pm.info.requestName} - PASS =====`);\r

      }\r

      else {\r

      \    // === Console Message ===\r

      \    console.log(`===== ${pm.info.requestName} - FAIL =====`);\r

      \    console.log(`Response Code - ${pm.response.code}`);\r

      \    console.log(pm.response.text());\r

      }"
    language: text/javascript
order: 10000
