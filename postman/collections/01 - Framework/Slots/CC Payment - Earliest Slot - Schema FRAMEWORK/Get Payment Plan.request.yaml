scripts:
  - type: afterResponse
    code: "// ===========================================\r

      // Request: GET /users/current/carts/{{cart}}/paymentplan\r

      // Purpose: Retrieves payment plan details for the active cart at checkout\r

      // Auth: Bearer Token {{accessToken}}\r

      // Expected status: 200 OK\r

      // ===========================================\r

      \r

      // 🧩 ~~ Test Configuration ~~ 🧩\r

      var runBaselineTests   = pm.collectionVariables.get(\"runBaselineTests\");    // Set to false to skip baseline tests\r

      var runFunctionalTests = pm.collectionVariables.get(\"runFunctionalTests\");  // Set to false to skip functional tests \r

      var environmentFlag    = pm.environment.name;                               // Get the current environment name\r

      \r

      // 🧩 ~~ Strict Schema Toggle ~~ 🧩\r

      // Uncomment the line below to force strict validation ON for this request only\r

      var strictSchemaValidation = true;\r

      \r

      // Use collection variable (default behavior) - comment this out if you want to override the collection variable value\r

      //var strictSchemaValidationRaw = pm.collectionVariables.get(\"strictSchemaValidation\");\r

      //var strictSchemaValidation    =\r

      //    strictSchemaValidationRaw === true || strictSchemaValidationRaw === \"true\";\r

      \r

      // 🧩 ~~ Generic Uptime Tests ~~ 🧩\r

      pm.test(\"[Payment Plan Controller] Get Payment Plan - Status code is 200\", () => {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"[Payment Plan Controller] Get Payment Plan - Response status is OK\", () => {\r

      \    pm.expect(pm.response.status).to.eq(\"OK\");\r

      });\r

      \r

      // Conditional check for further testing\r

      if (pm.response.code === 200) {\r

      \r

      \    // 🧩 ~~ Variable Declarations ~~ 🧩\r

      \    var jsonData              = pm.response.json();\r

      \    var paymentIntentions     = jsonData.paymentIntentions || [];\r

      \    var firstIntention        = paymentIntentions[0] || {};\r

      \    var paymentInfo           = firstIntention.paymentInfo || {};\r

      \    var firstIntentionAmount  = firstIntention?.amount;\r

      \    var firstIntentionCode    = firstIntention?.code;\r

      \    var paymentIntentionsCode = pm.collectionVariables.get(\"paymentIntentionsCode\")\r

      \    var totalPrice            = pm.collectionVariables.get(\"totalPrice\")\r

      \r

      \    if (runBaselineTests) {\r

      \r

      \        // 🧩 ~~ Schema Definition ~~ 🧩\r

      \        const responseSchema = {\r

      \            type: \"object\",\r

      \            additionalProperties: !strictSchemaValidation,\r

      \            required: [\r

      \                \"amountPaid\",\r

      \                \"coversCartTotal\",\r

      \                \"paymentExplainer\",\r

      \                \"paymentIntentions\"\r

      \            ],\r

      \            properties: {\r

      \                amountPaid: {\r

      \                    type: \"object\",\r

      \                    additionalProperties: !strictSchemaValidation,\r

      \                    required: [\"payments\", \"total\"],\r

      \                    properties: {\r

      \                        payments: { type: \"array\" },\r

      \                        total: {\r

      \                            type: \"object\",\r

      \                            additionalProperties: !strictSchemaValidation,\r

      \                            required: [\r

      \                                \"currencyIso\",\r

      \                                \"formattedValue\",\r

      \                                \"value\"\r

      \                            ],\r

      \                            properties: {\r

      \                                currencyIso:       { type: \"string\" },\r

      \                                formattedValue:    { type: \"string\" },\r

      \                                value:             { type: \"number\" }\r

      \                            }\r

      \                        }\r

      \                    }\r

      \                },\r

      \                coversCartTotal: { type: \"boolean\" },\r

      \                paymentExplainer: {\r

      \                    type: \"object\",\r

      \                    additionalProperties: !strictSchemaValidation,\r

      \                    required: [\"cartCheckoutInfoMessage\", \"cartInfoMessage\"],\r

      \                    properties: {\r

      \                        cartCheckoutInfoMessage:   { type: \"string\" },\r

      \                        cartInfoMessage:           { type: \"string\" }\r

      \                    }\r

      \                },\r

      \                paymentIntentions: {\r

      \                    type: \"array\",\r

      \                    items: {\r

      \                        type: \"object\",\r

      \                        additionalProperties: !strictSchemaValidation,\r

      \                        required: [\r

      \                            \"amount\",\r

      \                            \"code\",\r

      \                            \"paymentInfo\",\r

      \                            \"paymentMode\",\r

      \                            \"requiresExecution\",\r

      \                            \"status\"\r

      \                        ],\r

      \                        properties: {\r

      \                            amount: { type: \"number\" },\r

      \                            code:   { type: \"string\" },\r

      \                            paymentInfo: {\r

      \                                type: \"object\",\r

      \                                additionalProperties: !strictSchemaValidation,\r

      \                                required: [\r

      \                                    \"type\",\r

      \                                    \"cardAccountHolderName\",\r

      \                                    \"cardAccountNumber\",\r

      \                                    \"cardAccountNumberMasked\",\r

      \                                    \"cardCardType\",\r

      \                                    \"code\",\r

      \                                    \"cardExpirationMonth\",\r

      \                                    \"cardExpirationYear\",\r

      \                                    \"creditCardTypeName\",\r

      \                                    \"defaultCard\",\r

      \                                    \"id\",\r

      \                                    \"issuer\",\r

      \                                    \"level\",\r

      \                                    \"paymentType\",\r

      \                                    \"saved\",\r

      \                                    \"vendor\",\r

      \                                    \"verified\"\r

      \                                ],\r

      \                                properties: {\r

      \                                    type:                           { type: \"string\" },\r

      \                                    cardAccountHolderName:          { type: \"string\" },\r

      \                                    cardAccountNumber:              { type: \"string\" },\r

      \                                    cardAccountNumberMasked:        { type: \"string\" },\r

      \                                    cardCardType:                   { type: \"string\" },\r

      \                                    cardExpirationDisplay:          { type: \"string\" },\r

      \                                    cardExpirationMonth:            { type: \"number\" },\r

      \                                    cardExpirationYear:             { type: \"number\" },\r

      \                                    cardExpired:                    { type: \"boolean\" },\r

      \                                    cardExpiredOnFulfilmentDate:    { type: \"boolean\" },\r

      \                                    cardIssueNumber:                { type: [\"string\", \"null\"] },\r

      \                                    cardType:                       { type: \"string\" },\r

      \                                    code:                           { type: \"string\" },                                    \r

      \                                    creditCardTypeName:             { type: \"string\" },\r

      \                                    countryCode:                    { type: \"string\" },\r

      \                                    defaultCard:                    { type: \"boolean\" },\r

      \                                    displayMaskedCardNumber:        { type: \"string\" },\r

      \                                    displayPaymentType:             { type: \"string\" },\r

      \                                    id:                             { type: \"string\" },\r

      \                                    issuer:                         { type: \"string\" },\r

      \                                    level:                          { type: \"string\" },\r

      \                                    paymentType:                    { type: \"string\" },\r

      \                                    saved:                          { type: \"boolean\" },\r

      \                                    vendor:                         { type: \"string\" },\r

      \                                    verified:                       { type: \"boolean\" }\r

      \                                }\r

      \                            },\r

      \                            paymentMode:        { type: \"string\" },\r

      \                            requiresExecution:  { type: \"boolean\" },\r

      \                            status:             { type: \"string\" }\r

      \                        }\r

      \                    }\r

      \                }\r

      \            }\r

      \        };\r

      \r

      \        // 🧩 ~~ Schema Validation Test ~~ 🧩\r

      \        pm.test(\"[Payment Plan Controller] Get Payment Plan - Response matches schema\", () => {\r

      \            pm.response.to.have.jsonSchema(responseSchema);\r

      \        });\r

      \    }\r

      \r

      \    // 🧩 ~~ Functional Tests ~~ 🧩\r

      \    if (runFunctionalTests) {\r

      \r

      \        // --- Complementary Functional Tests ---\r

      \        pm.test(\"[Payment Plan Controller] Get Payment Plan - PaymentIntentions list is not empty\", () => {\r

      \            pm.expect(paymentIntentions.length).to.be.greaterThan(0);\r

      \        });\r

      \r

      \        pm.test(\"[Payment Plan Controller] Get Payment Plan - Payment Intention is using correct Type\", () => {\r

      \            pm.expect(paymentInfo.type).to.eq(\"creditCardPaymentInfoWsDTO\");\r

      \        });\r

      \r

      \        pm.test(\"[Payment Plan Controller] Get Payment Plan - PaymentIntentions is using correct card holder\", () => {\r

      \            pm.expect(paymentInfo.cardAccountHolderName).to.eq(\"API Auto\");\r

      \        });\r

      \r

      \        pm.test(\"[Payment Plan Controller] Get Payment Plan - Selected credit card is not expired\", () => {\r

      \            pm.expect(paymentInfo.cardExpired).to.be.false;\r

      \        });\r

      \r

      \        pm.test(\"[Payment Plan Controller] Get Payment Plan - Selected credit card is saved\", () => {\r

      \            pm.expect(paymentInfo.saved).to.be.true;\r

      \        });\r

      \r

      \        // --- Business Rule Functional Tests ---\r

      \        pm.test(\"[Payment Plan Controller] Get Payment Plan - RoversCartTotal is false\", () => {\r

      \            pm.expect(jsonData.coversCartTotal).to.eq(false);\r

      \        });\r

      \r

      \        pm.test(\"[Payment Plan Controller] Get Payment Plan - Payment Intention Amount Is Correct\", () => {\r

      \            pm.expect(firstIntentionAmount).to.eq(totalPrice);\r

      \        });        \r

      \r

      \        pm.test(\"[Payment Plan Controller] Get Payment Plan - Payment Intention Coode Is Correct\", () => {\r

      \            pm.expect(firstIntentionCode).to.eq(paymentIntentionsCode);\r

      \        }); \r

      \r

      \        pm.test(\"[Payment Plan Controller] Get Payment Plan - Payment mode is correct\", () => {\r

      \            pm.expect(firstIntention.paymentMode).to.eq(\"PAY_BY_CARD\");\r

      \        });\r

      \r

      \        pm.test(\"[Payment Plan Controller] Get Payment Plan - Payment Intention still requires execution\", () => {\r

      \            pm.expect(firstIntention.requiresExecution).to.be.true;\r

      \        });\r

      \r

      \        pm.test(\"[Payment Plan Controller] Get Payment Plan - Payment Intention is in active status\", () => {\r

      \            pm.expect(firstIntention.status).to.eq(\"ACTIVE\");\r

      \        });\r

      \    }\r

      \r

      \    // === Console Message ===\r

      \    console.log(`===== ${pm.info.requestName} - PASS =====`);\r

      }\r

      else {\r

      \    // === Console Message ===\r

      \    console.log(`===== ${pm.info.requestName} - FAIL =====`);\r

      \    console.log(`Response Code - ${pm.response.code}`);\r

      \    console.log(pm.response.text());\r

      }"
    language: text/javascript
