$kind: http-request
url: "{{pnpOne}}/users/current/carts/{{cart}}/validation"
method: PUT
headers:
  Origin: "{{oneOriginHeader}}"
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: "// ===========================================\r

      // Request: PUT /users/current/carts/{{cart}}/validation\r

      // Purpose: Validate that products in cart are still available\r

      // Auth: Bearer token {{accessToken}}\r

      // Expected status: 200 OK\r

      // ===========================================\r

      \r

      // 🧩 ~~ Test Configuration ~~ 🧩\r

      var environmentFlag = pm.environment.name; // Get the current environment name\r

      \r

      // 🧩 ~~ Generic Uptime Tests ~~ 🧩\r

      pm.test(\"[Carts Controller] Product Availability - Status code is 200\", () => {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"[Carts Controller] Product Availability - Response status is OK\", () => {\r

      \    pm.expect(pm.response.status).to.eql(\"OK\");\r

      });\r

      \r

      // Conditional block\r

      if (pm.response.code === 200) {\r

      \r

      \    // No jsonData needed — Hybris returns no body for Product Availability (Happy Scenario)\r

      \r

      \    // === Console Message ===\r

      \    console.log(`===== ${pm.info.requestName} - PASS =====`);\r

      \r

      } else {\r

      \r

      \    // === Console Message ===\r

      \    console.log(`===== ${pm.info.requestName} - FAIL =====`);\r

      \    console.log(pm.response.text());\r

      }"
    language: text/javascript
order: 13000
